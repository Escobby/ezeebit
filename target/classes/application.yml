server:
  port: 8080

spring:
  application:
    name: ezeebit-wallet
  datasource:
    url: jdbc:mysql://localhost:3306/ezeebit_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ezeebit
    password: ezeebit
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# How long a conversion quote stays valid for before the merchant must re-quote.
ezeebit:
  conversion:
    quote-ttl-seconds: 20
  system:
    merchant-id: 0
